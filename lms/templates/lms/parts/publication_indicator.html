{% load lms_tags %}<span class="publication-indicator is-{{ state }}" title="{% if state == 'published' %}Опубликовано полностью{% elif state == 'partial' %}Опубликовано частично: не всё содержимое ниже опубликовано{% else %}Черновик: опубликованного содержимого пока нет{% endif %}" aria-label="{% if state == 'published' %}Опубликовано полностью{% elif state == 'partial' %}Опубликовано частично{% else %}Черновик{% endif %}">{% icon "check" "icon icon-sm" %}{% if state == "partial" %}<span class="publication-indicator__warning" aria-hidden="true">!</span><span class="publication-indicator__text">не всё опубликовано</span>{% endif %}</span>
