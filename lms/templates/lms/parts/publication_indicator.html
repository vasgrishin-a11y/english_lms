{% load lms_tags %}<span class="publication-indicator is-{{ state }}" title="{% if state == 'published' %}Опубликовано полностью{% elif state == 'partial' %}Опубликовано частично: не всё содержимое ниже опубликовано{% else %}Черновик: опубликованного содержимого пока нет{% endif %}">{% icon "check" "icon icon-sm" %}{% if state == "partial" %}<span class="publication-indicator__warning" aria-hidden="true">!</span><span class="publication-indicator__text" aria-hidden="true">не всё опубликовано</span>{% endif %}<span class="sr-only">Статус: {% if state == "published" %}опубликовано полностью{% elif state == "partial" %}опубликовано частично, не всё содержимое ниже опубликовано{% else %}черновик{% endif %}</span></span>
