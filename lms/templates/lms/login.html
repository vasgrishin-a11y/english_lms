{% extends "lms/base.html" %}

{% block title %}Вход — English LMS{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto;">
    <h2>Вход в систему</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn" type="submit">Войти</button>
    </form>

    <p class="muted small">
        Учётные записи учеников создаёт преподаватель через админ-панель.
    </p>
</div>
{% endblock %}
