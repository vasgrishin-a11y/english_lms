{% extends "lms/base.html" %}
{% block title %}Вход — English LMS{% endblock %}
{% block content %}
<div class="card login-card">
    <h1>Вход в систему</h1>
    <form method="post">
        {% csrf_token %}
        {% include "lms/form_fields.html" %}
        <button class="btn" type="submit">Войти</button>
    </form>
    <p class="muted small">Учётные записи создаёт администратор. Для восстановления доступа обратитесь к нему.</p>
</div>
{% endblock %}
