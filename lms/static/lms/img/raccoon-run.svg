<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" role="img" aria-label="Бегущий енот в шарфе">
  <defs>
    <linearGradient id="rfur" x1="34" y1="22" x2="82" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c3ccd4"/>
      <stop offset="1" stop-color="#95a0aa"/>
    </linearGradient>
    <linearGradient id="rtail" x1="8" y1="14" x2="45" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8c2ca"/>
      <stop offset="1" stop-color="#7f8b96"/>
    </linearGradient>
    <clipPath id="tailclip"><ellipse cx="25" cy="28" rx="20" ry="8.8"/></clipPath>
  </defs>

  <!-- Пушистый хвост с тёмными кольцами и белым кончиком -->
  <g transform="rotate(-38 25 28)">
    <ellipse cx="25" cy="28" rx="20" ry="8.8" fill="url(#rtail)"/>
    <g clip-path="url(#tailclip)">
      <ellipse cx="7" cy="28" rx="7.5" ry="9.6" fill="#f7f5f1" opacity=".95"/>
      <rect x="13" y="14" width="5.6" height="29" fill="#454c55" opacity=".92"/>
      <rect x="23.6" y="14" width="5.6" height="29" fill="#454c55" opacity=".92"/>
      <rect x="34.2" y="14" width="5.6" height="29" fill="#454c55" opacity=".92"/>
    </g>
  </g>

  <!-- Задние лапы -->
  <path d="M43 44c-4.6 3.4-8 8-9.6 12.6" stroke="#5f6a75" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M63 45c1.6 4.4 3.4 8.4 6 11.6" stroke="#5f6a75" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="33" cy="57.4" r="2.6" fill="#3b4149"/>
  <circle cx="69.4" cy="57.4" r="2.6" fill="#3b4149"/>

  <!-- Туловище -->
  <ellipse cx="53" cy="37" rx="21" ry="12.5" fill="url(#rfur)"/>
  <path fill="#f7f5f1" d="M40 41c4.6 4.4 13 6.2 21 4.6-7.4 3.6-16.8 2.6-23-2.2l2-2.4Z" opacity=".9"/>

  <!-- Передние лапы -->
  <path d="M48 45c-4 3.6-7.6 8-9.6 12.4" stroke="#95a0aa" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M62 46c2 4 4.4 7.6 7.2 10.6" stroke="#95a0aa" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="38.6" cy="58" r="2.7" fill="#3b4149"/>

  <!-- Голова: уши, маска, белая мордочка -->
  <path fill="#95a0aa" d="M65.5 19.5 68 4.4l8.6 10.4-11.1 4.7Z"/>
  <path fill="#454c55" d="M69 16.6 70.6 8l4.2 6.2-5.8 2.4Z"/>
  <path fill="#e8dcd6" d="M69.6 15.8 70.8 10l2.8 4.2-4 1.6Z" opacity=".85"/>
  <path fill="#95a0aa" d="M80 20.6 85.6 6.6l6 12.2-11.6 1.8Z"/>
  <path fill="#454c55" d="M82.4 18.8 85 10.8l3.4 6.6-6 1.4Z"/>
  <path fill="#e8dcd6" d="M83.4 17.8 85 12.6l2 4-3.6 1.2Z" opacity=".85"/>
  <circle cx="74.5" cy="26" r="12" fill="url(#rfur)"/>

  <!-- Тёмная «маска» вокруг глаз — главная примета енота -->
  <path fill="#3b4149" d="M63.6 23.6c3-3.4 8-4.6 11.6-2.6 2 1.1 3.4 2.4 4.4 3.8-1.4 3.4-4.8 5.4-9 5.2-3.6-.2-6.6-2.4-7-6.4Z" opacity=".93"/>
  <path fill="#3b4149" d="M78.2 19.8c3-1.2 6.6-.6 9 1.6 2.2 2 3 4.6 2.6 7-3 1.6-6.8 1-9.4-1.2-2.2-1.8-3-4.6-2.2-7.4Z" opacity=".93"/>
  <ellipse cx="70" cy="24.8" rx="3.2" ry="2.7" fill="#f7f5f1"/>
  <ellipse cx="80.6" cy="25.2" rx="3.2" ry="2.7" fill="#f7f5f1"/>
  <circle cx="70.4" cy="25" r="1.75" fill="#262b31"/>
  <circle cx="81" cy="25.4" r="1.75" fill="#262b31"/>
  <circle cx="69.8" cy="24.2" r=".62" fill="#fff"/>
  <circle cx="80.4" cy="24.6" r=".62" fill="#fff"/>

  <!-- Светлые «брови» -->
  <path fill="#f7f5f1" d="M65.4 20.4c2.4-1.4 5.2-1.2 7 .2-2.2.8-4.8.8-7-.2Z"/>
  <path fill="#f7f5f1" d="M84.6 20.2c-2.2-1.6-4.8-1.8-6.8-.6 2 .8 4.6 1 6.8.6Z"/>

  <!-- Мордочка: белая, с аккуратным носом и улыбкой -->
  <ellipse cx="82.4" cy="31.4" rx="7.4" ry="5.4" fill="#f7f5f1"/>
  <ellipse cx="87.6" cy="29.6" rx="2.2" ry="1.8" fill="#262b31"/>
  <path d="M84.4 32.4c1.2.9 2.4.7 3.1-.2" stroke="#454c55" stroke-width=".95" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M79 28.6c1.5-.5 3-.4 4.2.2" stroke="#454c55" stroke-width=".8" fill="none" stroke-linecap="round" opacity=".35"/>

  <!-- Шарф — фирменный акцент бренда -->
  <path fill="#2a9d94" d="M63 33.6c4.6 3.4 10.4 4.6 16 3.2l1 5.2c-6.6 2-13.6.6-19-3.4l2-5Z"/>
  <path fill="#5c8a66" d="M75.6 36.2l7 6.6-5.4 1.4-3.4-5.4 1.8-2.6Z"/>
  <path d="M63.6 34.4c4.4 3.2 9.8 4.4 15 3.2" stroke="#8fd6ce" stroke-width="1.1" fill="none" opacity=".7" stroke-linecap="round"/>
</svg>
