[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/audit/reproduce.py", "lms/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["core", "lms"]
omit = ["*/migrations/*", "*/tests/*", "core/test_settings.py", "core/asgi.py", "core/wsgi.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["lms/tests", "docs/audit", "core/test_settings.py"]
