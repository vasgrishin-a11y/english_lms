# Развёртывание в Amvera Cloud.
# Схема: https://docs.amvera.ru/applications/configuration/docker.html
#
# ПОЧЕМУ ЭТОТ ФАЙЛ НУЖЕН. Без него Amvera находит корневой Dockerfile, но
# подставляет значения по умолчанию, которые не совпадают с этим приложением:
#   * containerPort по умолчанию 80, а gunicorn слушает ${PORT:-8000}.
#     Сборка проходит, контейнер стартует, но ingress шлёт запросы на порт 80,
#     где никто не слушает. Отказ полностью немой.
#   * persistenceMount по умолчанию /data, а приватные файлы заданий и ответов
#     учеников лежат в DJANGO_MEDIA_ROOT=/app/var/media. Без явного mount они
#     не переживают пересборку.
#
# СЕКРЕТЫ ЗДЕСЬ НЕ ХРАНЯТСЯ. Задайте переменные окружения в интерфейсе Amvera
# (раздел «Конфигурация»/«Переменные окружения» приложения), минимум:
#   DJANGO_SECRET_KEY         — secrets.token_urlsafe(64), >= 50 символов
#   DJANGO_ALLOWED_HOSTS      — публичный домен без wildcard, напр. lms.example.ru
#   DJANGO_CSRF_TRUSTED_ORIGINS — https://<тот же домен>
#   DATABASE_URL              — внешний PostgreSQL, пароль URL-encoded,
#                               sslmode=require/verify-full по требованию провайдера
#   DJANGO_TRUST_PROXY_SSL_HEADER — True, если ingress перезаписывает
#                               X-Forwarded-Proto; см. docs/DEPLOYMENT.md
#
# Первый запуск: DJANGO_RUN_MIGRATIONS=true (одна реплока) и
# DJANGO_CREATE_SUPERUSER=true с DJANGO_SUPERUSER_USERNAME/PASSWORD. После
# bootstrap удалите DJANGO_SUPERUSER_PASSWORD. Миграции в production должен
# запускать один release job, а не каждая реплока.

meta:
  environment: docker
  toolchain:
    name: docker

build:
  # Без build.dockerfile платформа ищет Dockerfile сама в фиксированном
  # порядке; указываем явно, чтобы при переименовании сборка не молчала.
  dockerfile: Dockerfile

run:
  # Должно совпадать с портом из docker-entrypoint.sh (--bind 0.0.0.0:${PORT}).
  # Amvera выставляет переменную PORT равной этому значению.
  containerPort: 8000

  # Постоянное приватное хранилище. Значение обязано совпадать с
  # DJANGO_MEDIA_ROOT из Dockerfile; каталог должен оставаться доступным
  # пользователю 10001:10001, которому собирается образ.
  persistenceMount: /app/var/media

# run.command / run.args намеренно не заданы: CMD в Dockerfile уже запускает
# ./docker-entrypoint.sh, который валидирует media mount, проверяет миграции и
# поднимает gunicorn. Переопределение command заменило бы этот шаг.